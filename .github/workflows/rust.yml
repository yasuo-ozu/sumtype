name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV (1.57.0)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.57.0
    # Only `cargo check` at the MSRV (announce's): it verifies the library targets compile on 1.57
    # without building the test suite (the tests use newer-than-1.57 syntax, which is dev-only).
    - name: cargo check
      run: cargo check --workspace --verbose

  test:
    name: Build, test, clippy (stable)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Run clippy
      run: RUSTFLAGS="-Dwarnings" cargo clippy --workspace --all-targets --no-deps
