[package]
name = "sumtype"
description = "Generate zerocost anonymous sum types that implement common traits"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
version = "0.2.6"
repository = "https://github.com/yasuo-ozu/sumtype"
edition = "2021"
rust-version = "1.56.0"
keywords = ["macros", "zerocost", "enum", "union-type", "iterator"]
categories = ["data-structures", "rust-patterns"]
license = "MIT"

[lib]
path = "lib.rs"

[dependencies]
sumtype-macro = { path = "macro", version = "0.2.6" }

[dev-dependencies]
trybuild = "1.0"

[workspace]

members = [
	".",
	"macro",
]

resolver = "2"
