[package]
name = "sumtype-macro"
description = "Generate zerocost anonymous sum types that implement common traits"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
version = "0.5.1"
repository = "https://github.com/yasuo-ozu/sumtype"
homepage = "https://github.com/yasuo-ozu/sumtype"
documentation = "https://docs.rs/sumtype"
edition = "2021"
rust-version = "1.58"
keywords = ["macros", "zerocost", "enum", "union-type", "iterator"]
categories = ["data-structures", "memory-management", "rust-patterns"]
license = "MIT"

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
proc-macro2 = "1.0"
template-quote = "0.4"
proc-macro-error = "1.0"
proc-macro-crate = "1"
derive-syn-parse = "0.1.5"
syn_derive = "0.1.8"
announce = "0.1.0"

[dependencies.syn]
version = "2.0"
features = ["full", "derive", "printing", "extra-traits", "visit", "visit-mut"]
